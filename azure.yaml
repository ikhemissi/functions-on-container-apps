# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: functions-on-container-apps

# One Terraform root (infra/): each file is one part of the architecture, built from the modules in infra/modules;
# connections.tf wires the optional parts together. Put the project's own resources in a new file of infra/.
infra:
  provider: terraform
  path: infra

# Built in the container registry (remote build) and deployed to the function app on Container Apps (infra/functions.tf).
services:
  receipt-functions:
    project: ./src/ReceiptFunctions
    language: dotnet
    host: containerapp
    docker:
      path: Dockerfile
      remoteBuild: true

# Each event runs the steps of infra/hooks/<event>/ in name order (infra/hooks/run.sh): what Terraform cannot do.
hooks:
  preprovision:
    posix:
      shell: sh
      run: bash ./infra/hooks/run.sh preprovision
      interactive: false
      continueOnError: false
  postprovision:
    posix:
      shell: sh
      run: bash ./infra/hooks/run.sh postprovision
      interactive: false
      continueOnError: false
  postdeploy:
    posix:
      shell: sh
      run: bash ./infra/hooks/run.sh postdeploy
      interactive: false
      continueOnError: false
  predown:
    posix:
      shell: sh
      run: bash ./infra/hooks/run.sh predown
      interactive: false
      continueOnError: false
  postdown:
    posix:
      shell: sh
      run: bash ./infra/hooks/run.sh postdown
      interactive: false
      continueOnError: false
