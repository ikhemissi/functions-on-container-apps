# Offline checks of the sample: no Azure access and no secrets; nothing is pushed or deployed. Each job runs locally,
# from the repository root, with the commands of its steps.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build src -warnaserror
      - name: Test
        run: dotnet test --solution src/ReceiptFunctions.slnx
      - name: Container image
        run: docker build src/ReceiptFunctions

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: Format
        run: terraform -chdir=infra fmt -check -recursive
      - name: Validate the root
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate
      - name: Test the modules
        run: |
          for module in infra/modules/*/; do
            echo "::group::$module"
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" test
            echo "::endgroup::"
          done

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell scripts
        run: |
          if [ -z "$(git ls-files '*.sh')" ]; then echo "No shell scripts."; exit 0; fi
          git ls-files -z '*.sh' | xargs -0 shellcheck -x
